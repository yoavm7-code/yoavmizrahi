<!doctype html>
<!-- The page GitHub Pages shows for any address that doesn't exist. Hand-written, not generated.
     Paths start with / because it is served at whatever address was asked for. Its policy must match
     SITE_CSP in js/render.js (tests/unit/static-pages.test.mjs checks it). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://i.ytimg.com; media-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing here · Yoav Mizrahi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDE9E1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="lost grid-surface">

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand uline" href="/">Yoav Mizrahi</a>
    <span class="page-name mono">404</span>
  </div>
</header>

<main class="wrap lost__body">
  <span class="label label--accent">ERROR 404</span>
  <h1 class="display">Nothing on this part of the desk.</h1>
  <p class="lost__text">The link may be old, or the address has a typo.</p>
  <a class="btn pill pill--solid lost__back" href="/">Back to the desk</a>
</main>

</body>
</html>
